version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmacia_landing_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-FarmaciaPgSecure2026}@postgres:5432/${DB_NAME:-farmacia_leads}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-FarmaciaFeira2026!}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-"Farmácias F. da Silva Graça" <geral@farmaciasfsilvagraca.pt>}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - farmacia_net

  postgres:
    image: postgres:16-alpine
    container_name: farmacia_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-FarmaciaPgSecure2026}
      POSTGRES_DB: ${DB_NAME:-farmacia_leads}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-farmacia_leads}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - farmacia_net

volumes:
  pgdata:
    driver: local

networks:
  farmacia_net:
    driver: bridge
